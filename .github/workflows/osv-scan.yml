name: OSV scan

# Checks package-lock.json against the OSV vulnerability database (review P1: Renovate and OSV). A
# known vulnerability in a dependency fails the job and lists it in the security tab. No server, no
# cost. Renovate (renovate.json) proposes the upgrades.
on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  schedule:
    - cron: '30 2 * * 1'   # Monday 08:00 IST, so a new advisory surfaces within the week
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write   # to upload the findings to the security tab

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --recursive
        ./
