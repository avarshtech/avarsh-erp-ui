name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to test (empty for all)'
        required: false
        type: choice
        options:
          - ''
          - master-data
          - costing
          - orders
          - bom
          - po
          - admin
          - validation
  # Trigger after deploy (uncomment and configure webhook)
  # repository_dispatch:
  #   types: [deploy-complete]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout UI repo
        uses: actions/checkout@v4

      - name: Checkout API repo
        uses: actions/checkout@v4
        with:
          repository: avarshtech/erp-purchase
          path: erp-purchase
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install UI dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start API (H2 in-memory)
        run: |
          cd erp-purchase
          chmod +x gradlew
          SPRING_PROFILES_ACTIVE=e2e SERVER_PORT=8088 ./gradlew bootRun --quiet &
          echo "Waiting for API..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8088/api/v1/categories -H "Content-Type: application/json" > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            if [ $i -eq 90 ]; then
              echo "API failed to start"
              exit 1
            fi
            sleep 2
          done

      - name: Start UI dev server
        run: |
          VITE_API_BASE_URL=http://localhost:8088/api/v1 npm run dev &
          echo "Waiting for UI..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "UI is ready!"
              break
            fi
            sleep 2
          done

      - name: Run E2E Tests
        run: |
          MODULE="${{ github.event.inputs.module || '' }}"
          if [ -n "$MODULE" ]; then
            echo "Running module: $MODULE"
            npx playwright test --project="$MODULE"
          else
            echo "Running all modules"
            npx playwright test
          fi

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e-report/
          retention-days: 14
