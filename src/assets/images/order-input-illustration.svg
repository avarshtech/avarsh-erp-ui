<svg width="220" height="200" viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background subtle circles -->
  <circle cx="120" cy="105" r="85" fill="#1677ff" opacity="0.03"/>
  <circle cx="120" cy="105" r="65" fill="#1677ff" opacity="0.03"/>

  <!-- Sewing machine on the right side -->
  <rect x="148" y="88" width="52" height="40" rx="4" fill="#E8E8E8" stroke="#BFBFBF" stroke-width="1"/>
  <!-- Machine top arm -->
  <path d="M152 88 L152 68 Q152 62 158 62 L190 62 Q196 62 196 68 L196 88" fill="#D9D9D9" stroke="#BFBFBF" stroke-width="1"/>
  <!-- Machine wheel -->
  <circle cx="192" cy="75" r="8" fill="#F0F0F0" stroke="#BFBFBF" stroke-width="1"/>
  <circle cx="192" cy="75" r="3" fill="#D9D9D9"/>
  <!-- Needle area -->
  <line x1="160" y1="62" x2="160" y2="88" stroke="#8C8C8C" stroke-width="1.5"/>
  <line x1="160" y1="86" x2="160" y2="92" stroke="#595959" stroke-width="0.8"/>
  <!-- Fabric under needle -->
  <path d="M150 92 Q160 96 175 92 Q185 90 195 93" stroke="#1677ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M152 95 Q162 99 177 95 Q187 93 197 96" stroke="#1677ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.25"/>
  <!-- Machine table/base -->
  <rect x="145" y="128" width="58" height="5" rx="2" fill="#D9D9D9" stroke="#BFBFBF" stroke-width="0.8"/>
  <rect x="150" y="133" width="4" height="18" rx="1" fill="#BFBFBF"/>
  <rect x="194" y="133" width="4" height="18" rx="1" fill="#BFBFBF"/>
  <!-- Thread spool -->
  <rect x="176" y="56" width="8" height="10" rx="2" fill="#FF7A45" opacity="0.8"/>
  <line x1="180" y1="66" x2="160" y2="86" stroke="#FF7A45" stroke-width="0.6" opacity="0.5"/>

  <!-- Hanging fabric rolls behind -->
  <rect x="152" y="36" width="10" height="22" rx="5" fill="#BAE0FF" stroke="#91CAFF" stroke-width="0.8"/>
  <rect x="166" y="32" width="10" height="26" rx="5" fill="#D6E4FF" stroke="#ADC6FF" stroke-width="0.8"/>
  <rect x="180" y="38" width="10" height="20" rx="5" fill="#FFE7BA" stroke="#FFD591" stroke-width="0.8"/>

  <!-- Measuring tape on the floor -->
  <path d="M140 155 Q130 152 118 156 Q108 160 100 155" stroke="#FADB14" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <line x1="120" y1="154" x2="120" y2="158" stroke="#FADB14" stroke-width="1" opacity="0.4"/>
  <line x1="126" y1="153" x2="126" y2="156" stroke="#FADB14" stroke-width="0.8" opacity="0.3"/>
  <line x1="114" y1="156" x2="114" y2="159" stroke="#FADB14" stroke-width="0.8" opacity="0.3"/>

  <!-- Person — garment industry worker / merchandiser -->
  <!-- Hair -->
  <ellipse cx="78" cy="48" rx="17" ry="18" fill="#3D2B1F"/>
  <!-- Head -->
  <ellipse cx="78" cy="54" rx="13.5" ry="14.5" fill="#FFDBB4"/>
  <!-- Eyes — looking to upper-left -->
  <ellipse cx="73" cy="51.5" rx="2" ry="2.3" fill="#222A35"/>
  <ellipse cx="83" cy="51.5" rx="2" ry="2.3" fill="#222A35"/>
  <!-- Eye shine -->
  <circle cx="72.3" cy="50.8" r="0.8" fill="white"/>
  <circle cx="82.3" cy="50.8" r="0.8" fill="white"/>
  <!-- Eyebrows -->
  <path d="M70 48 Q73 46 76 48" stroke="#3D2B1F" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M80 48 Q83 46 86 48" stroke="#3D2B1F" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M74 60 Q78 64 82 60" stroke="#D4845A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Ears -->
  <ellipse cx="64.5" cy="54" rx="2.8" ry="3.8" fill="#F0C8A0"/>
  <ellipse cx="91.5" cy="54" rx="2.8" ry="3.8" fill="#F0C8A0"/>
  <!-- Glasses (merchandiser look) -->
  <circle cx="73" cy="51.5" r="5" fill="none" stroke="#8C8C8C" stroke-width="1"/>
  <circle cx="83" cy="51.5" r="5" fill="none" stroke="#8C8C8C" stroke-width="1"/>
  <line x1="78" y1="51.5" x2="78" y2="51.5" stroke="#8C8C8C" stroke-width="1"/>
  <path d="M78 51.5 L78 51.5" stroke="#8C8C8C" stroke-width="1"/>
  <line x1="68" y1="51.5" x2="64.5" y2="52" stroke="#8C8C8C" stroke-width="0.8"/>
  <line x1="88" y1="51.5" x2="91.5" y2="52" stroke="#8C8C8C" stroke-width="0.8"/>
  <!-- Glasses bridge -->
  <path d="M78 50 Q78 49 78 50" stroke="#8C8C8C" stroke-width="1"/>

  <!-- Polo shirt with collar (garment industry professional) -->
  <path d="M60 70 Q78 78 96 70 L100 126 H56 Z" fill="#1677ff"/>
  <!-- Collar -->
  <path d="M68 70 L72 66 L78 72 L84 66 L88 70" fill="#1061d9" stroke="#0E58B6" stroke-width="0.5"/>
  <!-- Polo button placket -->
  <line x1="78" y1="72" x2="78" y2="96" stroke="#1061d9" stroke-width="1.5" opacity="0.4"/>
  <circle cx="78" cy="78" r="1.2" fill="#F0F0F0" opacity="0.6"/>
  <circle cx="78" cy="84" r="1.2" fill="#F0F0F0" opacity="0.6"/>
  <circle cx="78" cy="90" r="1.2" fill="#F0F0F0" opacity="0.6"/>
  <!-- Shirt pocket with pen -->
  <rect x="84" y="80" width="8" height="7" rx="1" fill="#1061d9" opacity="0.5"/>
  <line x1="87" y1="77" x2="87" y2="82" stroke="#FFD700" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Left arm pointing to upper-left -->
  <path d="M60 76 L42 54 L26 34" stroke="#FFDBB4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Left hand -->
  <circle cx="24" cy="32" r="4.5" fill="#FFDBB4"/>
  <!-- Pointing finger -->
  <line x1="24" y1="32" x2="15" y2="21" stroke="#FFDBB4" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="14" cy="19.5" r="2.2" fill="#FFDBB4"/>

  <!-- Arrow pointing to upper-left corner -->
  <line x1="11" y1="15" x2="4" y2="6" stroke="#1677ff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <polyline points="4,12 4,5 11,5" stroke="#1677ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
  <!-- Sparkle dots -->
  <circle cx="8" cy="16" r="1.8" fill="#1677ff" opacity="0.2"/>
  <circle cx="16" cy="8" r="1.3" fill="#1677ff" opacity="0.18"/>

  <!-- Right arm holding clipboard/techpack -->
  <path d="M96 76 L112 94 L116 106" stroke="#FFDBB4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="117" cy="108" r="4.5" fill="#FFDBB4"/>
  <!-- Clipboard / techpack in right hand -->
  <rect x="108" y="96" width="24" height="32" rx="3" fill="#FFF7E6" stroke="#FFD591" stroke-width="1.2" transform="rotate(-10 120 112)"/>
  <!-- Clipboard lines (techpack content) -->
  <line x1="113" y1="104" x2="127" y2="101" stroke="#FFD591" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="114" y1="109" x2="125" y2="106.5" stroke="#FFD591" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="114.5" y1="114" x2="128" y2="111" stroke="#FFD591" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="115" y1="119" x2="123" y2="117" stroke="#FFD591" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Clipboard clip -->
  <rect x="117" y="93" width="8" height="5" rx="1.5" fill="#D48806" opacity="0.7" transform="rotate(-10 121 95.5)"/>

  <!-- Pants -->
  <path d="M58 122 L56 156 H68 L72 126" fill="#2C3E50"/>
  <path d="M98 122 L100 156 H88 L84 126" fill="#2C3E50"/>
  <!-- Belt -->
  <rect x="58" y="121" width="40" height="5" rx="2" fill="#34495E"/>
  <rect x="75" y="121" width="6" height="5" rx="1" fill="#D48806"/>

  <!-- Shoes -->
  <path d="M54 154 H70 Q72 160 66 162 H52 Q50 158 54 154 Z" fill="#3D2B1F"/>
  <path d="M86 154 H102 Q104 160 98 162 H84 Q82 158 86 154 Z" fill="#3D2B1F"/>

  <!-- Scissors on the floor near measuring tape -->
  <path d="M130 160 L138 152" stroke="#8C8C8C" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M130 160 L136 166" stroke="#8C8C8C" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="139" cy="151" r="3" fill="none" stroke="#8C8C8C" stroke-width="1"/>
  <circle cx="137" cy="167" r="3" fill="none" stroke="#8C8C8C" stroke-width="1"/>

  <!-- Ground shadow -->
  <ellipse cx="100" cy="172" rx="60" ry="5" fill="#1677ff" opacity="0.05"/>
  <ellipse cx="174" cy="158" rx="30" ry="3" fill="#1677ff" opacity="0.04"/>
</svg>
